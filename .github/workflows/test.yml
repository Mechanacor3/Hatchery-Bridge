name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-tested.txt
      - name: Syntax
        run: python -m py_compile server.py test_bridge.py install_tunnel.py probe_http.py
      - name: Test
        run: python test_bridge.py
      - name: Repository hygiene
        run: |
          test -z "$(git ls-files '.venv/**')"
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
